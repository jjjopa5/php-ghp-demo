name: CI + Reports to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно для пуша в gh-pages
  pages: read
  id-token: write

jobs:
  tests:
    name: Run tests and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug   # нужно для coverage-html :contentReference[oaicite:4]{index=4}

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run phpunit with coverage
        run: |
          mkdir -p build/coverage-html
          vendor/bin/phpunit --configuration=phpunit.xml

      - name: Run PHPCS and save report
        run: |
          mkdir -p build/phpcs
          vendor/bin/phpcs \
            --standard=phpcs.xml \
            --report=full \
            --report-file=build/phpcs/report.txt \
            src tests
        # форматы репортов см. в документации PHPCS :contentReference[oaicite:5]{index=5}

      - name: Prepare simple HTML wrapper for PHPCS
        run: |
          cat > build/phpcs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>PHP_CodeSniffer report</title>
            <style>
              body { font-family: system-ui, sans-serif; margin: 2rem; white-space: pre-wrap; }
              h1 { margin-bottom: 1rem; }
              .meta { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
              .content { font-family: monospace; font-size: 0.9rem; background: #f5f5f5; padding: 1rem; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>PHP_CodeSniffer report</h1>
            <div class="meta">
              Branch: ${GITHUB_REF_NAME}<br/>
              Commit: ${GITHUB_SHA}<br/>
              Run: ${GITHUB_RUN_NUMBER}
            </div>
            <div class="content">
          HTML

          cat build/phpcs/report.txt >> build/phpcs/index.html

          cat >> build/phpcs/index.html <<'HTML'
            </div>
          </body>
          </html>
          HTML

      - name: Archive reports for next job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build
          if-no-files-found: error

  publish-report:
    name: Publish reports to GitHub Pages
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download reports artifact
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: build

      # Подгружаем предыдущее содержимое gh-pages, если оно есть
      - name: Checkout gh-pages history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare report history
        run: |
          set -e

          # каталог, куда будем складывать всю историю
          HISTORY_DIR="report-history"
          mkdir -p "${HISTORY_DIR}"

          # если из gh-pages что-то пришло — переносим историю
          if [ -d gh-pages/"${HISTORY_DIR}" ]; then
            rsync -a gh-pages/"${HISTORY_DIR}"/ "${HISTORY_DIR}/"
          fi

          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_ID="${GITHUB_RUN_NUMBER}"

          RUN_DIR="${HISTORY_DIR}/${BRANCH}/${RUN_ID}-${SHORT_SHA}"
          mkdir -p "${RUN_DIR}"

          # phpunit coverage (HTML)
          if [ -d build/coverage-html ]; then
            mkdir -p "${RUN_DIR}/coverage-html"
            rsync -a build/coverage-html/ "${RUN_DIR}/coverage-html/"
          fi

          # phpcs report (HTML-обёртка)
          if [ -d build/phpcs ]; then
            mkdir -p "${RUN_DIR}/phpcs"
            rsync -a build/phpcs/ "${RUN_DIR}/phpcs/"
          fi

          # index для конкретного прогона
          cat > "${RUN_DIR}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>Reports for ${BRANCH} – ${RUN_ID}/${SHORT_SHA}</title>
          </head>
          <body>
            <h1>Reports for branch ${BRANCH}</h1>
            <p>Run: ${RUN_ID}, commit: ${SHORT_SHA}</p>
            <ul>
              <li><a href="coverage-html/index.html">PHPUnit coverage HTML</a></li>
              <li><a href="phpcs/index.html">PHP_CodeSniffer report</a></li>
            </ul>
            <p><a href="../../index.html">Back to branch index</a></p>
          </body>
          </html>
          EOF

          # index для ветки
          BRANCH_INDEX="${HISTORY_DIR}/${BRANCH}/index.html"
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head><meta charset="utf-8" /><title>Reports for branch '"${BRANCH}"'</title></head>'
            echo '<body>'
            echo '<h1>Reports for branch '"${BRANCH}"'</h1>'
            echo '<ul>'
            for d in $(ls -1 "${HISTORY_DIR}/${BRANCH}" | sort -r); do
              if [ -d "${HISTORY_DIR}/${BRANCH}/${d}" ]; then
                echo '<li><a href="'"${d}"'/index.html">'"${d}"'</a></li>'
              fi
            done
            echo '</ul>'
            echo '<p><a href="../index.html">Back to all branches</a></p>'
            echo '</body></html>'
          } > "${BRANCH_INDEX}"

          # корневой index со списком веток
          ROOT_INDEX="${HISTORY_DIR}/index.html"
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head><meta charset="utf-8" /><title>Test reports</title></head>'
            echo '<body>'
            echo '<h1>Test reports</h1>'
            echo '<ul>'
            for b in $(ls -1 "${HISTORY_DIR}"); do
              if [ -d "${HISTORY_DIR}/${b}" ]; then
                echo '<li><a href="'"${b}"'/index.html">'"${b}"'</a></li>'
              fi
            done
            echo '</ul>'
            echo '</body></html>'
          } > "${ROOT_INDEX}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: report-history
          keep_files: true
