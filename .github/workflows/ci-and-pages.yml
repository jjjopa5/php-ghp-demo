name: CI + Reports to GitHub Pages
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: read
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit + coverage
        run: |
          mkdir -p build/coverage-html
          vendor/bin/phpunit --configuration=phpunit.xml --coverage-html build/coverage-html

      - name: Run PHPCS + beautiful report
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NO: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          mkdir -p build/phpcs

          vendor/bin/phpcs \
            --standard=phpcs.xml \
            --report=json \
            --report-file=build/phpcs/report.json \
            src tests || true

          # Если JSON пустой — создаём чистый отчёт
          [ -s build/phpcs/report.json ] || cat > build/phpcs/report.json <<-JSON
          {
            "totals": { "errors": 0, "warnings": 0, "fixable": 0 },
            "files": {}
          }
          JSON

          # ←←←←←←←←←←←←←←←← ВОТ ТАК ПИШЕМ HTML — НИКАКИХ ОШИБОК!
          cat > build/phpcs/index.html <<-'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PHP_CodeSniffer Report</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <script src="https://cdn.tailwindcss.com"></script>
            <style>
              .success { background: linear-gradient(90deg, #10b981, #059669); }
              .error   { background: linear-gradient(90deg, #ef4444, #dc2626); }
              .warning { background: linear-gradient(90deg, #f59e0b, #d97706); }
            </style>
          </head>
          <body class="bg-gray-50 text-gray-900 min-h-screen">
            <div class="max-w-5xl mx-auto p-8">
              <h1 class="text-5xl font-extrabold text-center mb-12 bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                PHP_CodeSniffer Report
              </h1>

              <div class="bg-white rounded-2xl shadow-xl p-8 mb-10 text-center">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                  <div><div class="text-sm text-gray-500 uppercase tracking-wider">Branch</div><div class="text-2xl font-bold">${BRANCH}</div></div>
                  <div><div class="text-sm text-gray-500 uppercase tracking-wider">Commit</div><div class="text-2xl font-mono">${SHORT_SHA:0:7}</div></div>
                  <div><div class="text-sm text-gray-500 uppercase tracking-wider">Run #</div><div class="text-2xl font-bold">${RUN_NO}</div></div>
                </div>
              </div>

              <div id="report" class="space-y-8">
                <div class="text-center py-32"><div class="text-9xl animate-pulse">Loading...</div></div>
              </div>
            </div>

            <script>
              fetch('report.json')
                .then(r => r.json())
                .then(data => {
                  const t = data.totals || { errors: 0, warnings: 0 };
                  const files = data.files || {};
                  const el = document.getElementById('report');
                  el.innerHTML = '';

                  if (t.errors === 0 && t.warnings === 0) {
                    el.innerHTML = `
                      <div class="text-center py-20">
                        <div class="text-9xl mb-8">Perfect!</div>
                        <div class="text-6xl font-bold text-green-600 mb-6">No issues found!</div>
                        <p class="text-2xl text-gray-700">Your code is 100% PSR-12 compliant.<br>Keep it up!</p>
                      </div>`;
                    return;
                  }

                  let html = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                      <div class="success text-white p-10 rounded-2xl text-center shadow-2xl">
                        <div class="text-6xl font-bold">${Object.keys(files).length || 0}</div>
                        <div class="text-2xl">Files checked</div>
                      </div>
                      <div class="error text-white p-10 rounded-2xl text-center shadow-2xl">
                        <div class="text-6xl font-bold">${t.errors}</div>
                        <div class="text-2xl">Errors</div>
                      </div>
                      <div class="warning text-white p-10 rounded-2xl text-center shadow-2xl">
                        <div class="text-6xl font-bold">${t.warnings}</div>
                        <div class="text-2xl">Warnings</div>
                      </div>
                    </div>`;

                  Object.keys(files).forEach(file => {
                    const f = files[file];
                    if (f.errors === 0 && f.warnings === 0) return;
                    const clean = file.replace(/^\/home\/runner\/work\/[^\/]+\/[^\/]+\//, '');
                    html += `<div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
                      <h3 class="font-mono text-xl font-bold text-gray-800 mb-6">${clean}</h3>`;
                    f.messages.forEach(m => {
                      const type = m.type === 'ERROR' ? 'bg-red-100 text-red-800 border-l-8 border-red-500' : 'bg-amber-100 text-amber-800 border-l-8 border-amber-500';
                      html += `<div class="flex gap-6 p-5 rounded-lg ${type} mb-4">
                        <div class="font-bold text-lg w-16">L${m.line}</div>
                        <div>
                          <div class="font-medium">${m.message}</div>
                          <div class="text-sm text-gray-600 mt-1">${m.source || ''}</div>
                        </div>
                      </div>`;
                    });
                    html += `</div>`;
                  });

                  el.innerHTML = html;
                })
                .catch(() => el.innerHTML = '<div class="text-center text-red-600 text-4xl">Failed to load report.json</div>');
            </script>
          </body>
          </html>
          HTML
      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build

  publish-report:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy reports to GitHub Pages
        run: |
          set -e
          HISTORY="report-history"
          mkdir -p "$HISTORY"

          # Переносим старую историю
          if [ -d "gh-pages/$HISTORY" ]; then
            rsync -a "gh-pages/$HISTORY/" "$HISTORY/"
          elif [ -d gh-pages ] && [ "$(ls -A gh-pages)" ]; then
            rsync -a --exclude '.git' gh-pages/ "$HISTORY/"
          fi

          BRANCH="${GITHUB_REF_NAME//[^a-zA-Z0-9-]/-}"
          SHORT="${GITHUB_SHA:0:7}"
          RUN_ID="${GITHUB_RUN_NUMBER}"
          DIR="$HISTORY/$BRANCH/$RUN_ID-$SHORT"
          mkdir -p "$DIR"

          [ -d build/coverage-html ] && rsync -a build/coverage-html/ "$DIR/coverage-html/"
          [ -d build/phpcs ] && rsync -a build/phpcs/ "$DIR/phpcs/"

          # Страница прогона
          cat > "$DIR/index.html" <<'PAGE'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CI Reports</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:3rem auto;max-width:800px;background:#f9fafb;color:#1f2937;}
    a{color:#3b82f6;text-decoration:none;font-weight:500;}
    ul{list-style:none;padding:0;}
    li{margin:1rem 0;padding:1rem;background:white;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);}
  </style>
</head>
<body>
  <h1>Run ${{ github.run_number }} / ${{ github.sha_short }}</h1>
  <p>Branch: ${{ github.ref_name }} • Commit: ${{ github.sha_short }}</p>
  <ul>
    <li><a href="coverage-html/index.html">PHPUnit Coverage Report</a></li>
    <li><a href="phpcs/index.html">PHP_CodeSniffer Report</a></li>
  </ul>
  <p><a href="../index.html">← Back to branch history</a></p>
</body>
</html>
PAGE

          # latest → текущий прогон
          mkdir -p "$HISTORY/$BRANCH/latest"
          cat > "$HISTORY/$BRANCH/latest/index.html" <<'LATEST'
<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=../${{ github.run_number }}-${{ github.sha_short }}/index.html"></head><body>Redirecting...</body></html>
LATEST

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: report-history
          keep_files: true
